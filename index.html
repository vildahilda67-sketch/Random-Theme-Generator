
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runway Theme Generator</title>

    <style>
        body {
            background-color: #f8e8ee;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 80px 20px;
        }

        h1 {
            font-size: 45px;
            color: #d63384;
        }

        #theme {
            font-size: 35px;
            font-weight: bold;
            margin: 50px 0;
            color: #333;
        }

        button {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 22px;
            border-radius: 12px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ad2168;
        }
    </style>
</head>

<body>

    <h1>RUNWAY THEME GENERATOR</h1>

    <div id="theme">Click Roll to get your theme!</div>

    <button onclick="rollTheme()">ROLL</button>

    <script>
        const themes = [
            "Y2K",
            "Old Hollywood Glamour",
            "Fairytale",
            "Cyberpunk",
            "Met Gala",
            "Streetwear",
            "Cottagecore",
            "Gothic",
            "Barbiecore",
            "Denim on Denim",
            "Winter Wonderland",
            "Tropical Paradise",
            "Royalty",
            "Business Chic",
            "Punk Rock",
            "Angel vs Devil",
            "Monochrome",
            "Under the Sea",
            "80s Retro",
            "Futuristic Fashion",
            "Bridal",
            "Circus",
            "Cowboy",
            "Pirate",
            "Neon",
            "Floral",
            "Rockstar",
            "Luxury",
            "School Uniform",
            "Sportswear",
            "Superheroes",
            "Villains",
            "Greek Gods",
            "Masquerade",
            "Haunted",
            "Candyland",
            "Safari",
            "Space",
            "Renaissance",
            "Red Carpet",
            "Pajama Party",
            "Ballerina",
            "Military Inspired",
            "Pop Art",
            "Ice Queen",
            "Fire and Ice",
            "Wild West",
            "French Fashion",
            "All White",
            "All Black"
        ];

        function rollTheme() {
            const randomIndex = Math.floor(Math.random() * themes.length);
            document.getElementById("theme").textContent = themes[randomIndex];
        }
    </script>

</body>
</html>
